<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="课表">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>课表</title>
<style>
    :root{--accent:#2563eb;--accent-2:#1d4ed8;--ink:#111827;--ink-2:#4b5563;--bg:#f5f6f8;--line:#e6e8ec}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{background:radial-gradient(1200px 600px at 50% -10%,#e8efff,transparent 60%),var(--bg);
      color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;
      display:flex;align-items:center;justify-content:center;padding:24px;-webkit-text-size-adjust:100%}
    .card{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:20px;
      box-shadow:0 1px 2px rgba(16,24,40,.04),0 18px 40px -24px rgba(16,24,40,.35);padding:26px 22px 22px}
    .icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(180deg,#2563eb,#1d4ed8);color:#fff;font-size:28px;font-weight:700;margin:0 auto 14px}
    h1{font-size:19px;margin:0 0 6px;text-align:center;letter-spacing:.2px}
    p.sub{margin:0 0 18px;text-align:center;color:var(--ink-2);font-size:13.5px;line-height:1.5}
    input[type=password]{width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line);
      border-radius:12px;outline:none;background:#fbfbfd;color:var(--ink)}
    input[type=password]:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.14)}
    button{width:100%;margin-top:12px;padding:13px 14px;font-size:16px;font-weight:600;color:#fff;
      background:linear-gradient(180deg,#2563eb,#1d4ed8);border:0;border-radius:12px;cursor:pointer}
    button:active{transform:translateY(1px)}
    button[disabled]{opacity:.6}
    .err{min-height:18px;margin-top:10px;font-size:13px;color:#c02525;text-align:center}
    .remember{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--ink-2)}
    .remember input{margin:0}
    .hint{margin:16px 0 0;font-size:12px;color:#8b93a1;text-align:center;line-height:1.6}
    @media (prefers-color-scheme: dark){
      body{background:#0d1117;color:#e6edf3}
      .card{background:#161b22;border-color:#30363d}
      input[type=password]{background:#0d1117;border-color:#30363d;color:#e6edf3}
      p.sub,.remember{color:#9aa4b1}
      .hint{color:#6e7681}
    }
    </style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="icon">课</div>
  <h1>课表已加密</h1>
  <p class="sub">输入密码查看 16ри-2 单双周课表</p>
  <input id="pw" type="password" placeholder="密码" autocomplete="current-password"
         autocapitalize="off" autocorrect="off" spellcheck="false" required>
  <button id="go" type="submit">打开</button>
  <div class="err" id="err"></div>
  <label class="remember"><input type="checkbox" id="remember" checked> 在这台设备上记住我</label>
  <p class="hint">内容整体加密存放，密码不对打不开。</p>
</form>

var KEYSTORE = 'kebiao.key.v1';
var form = document.getElementById('f');
var pw = document.getElementById('pw');
var go = document.getElementById('go');
var err = document.getElementById('err');
var remember = document.getElementById('remember');

function b64d(s) {
  var bin = atob(s), u = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function b64e(buf) {
  var u = new Uint8Array(buf), s = '', CH = 0x8000;
  for (var i = 0; i < u.length; i += CH) s += String.fromCharCode.apply(null, u.subarray(i, i + CH));
  return btoa(s);
}
async function deriveFromPassword(p) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64d(CFG.salt), iterations: CFG.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
function importKey(raw) {
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['decrypt']);
}
async function decryptWith(key) {
  var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(CFG.iv) }, key, b64d(CFG.ct));
  return new TextDecoder().decode(buf);
}
function mount(html) {
  document.open();
  document.write(html);
  document.close();
}
function fail(msg) {
  err.textContent = msg;
  go.disabled = false;
  go.textContent = '打开';
}

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  if (!pw.value) { fail('请输入密码'); return; }
  err.textContent = '';
  go.disabled = true;
  go.textContent = '解锁中…';
  try {
    var key = await deriveFromPassword(pw.value);
    var html = await decryptWith(key);
    if (remember.checked) {
      try { localStorage.setItem(KEYSTORE, b64e(await crypto.subtle.exportKey('raw', key))); } catch (x) {}
    }
    mount(html);
  } catch (x) {
    fail('密码不对，打不开');
  }
});

(async function () {
  var saved = null;
  try { saved = localStorage.getItem(KEYSTORE); } catch (x) {}
  if (saved) {
    try {
      var html = await decryptWith(await importKey(b64d(saved)));
      mount(html);
      return;
    } catch (x) {
      try { localStorage.removeItem(KEYSTORE); } catch (y) {}
    }
  }
  try { pw.focus(); } catch (x) {}
})();
